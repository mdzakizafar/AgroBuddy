# ==========================================================
# AgroBuddy Render Blueprint (1-Click Deployment)
# ==========================================================
services:
  # --- Backend FastAPI Web Service ---
  - type: web
    name: agrobuddy-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GROQ_API_KEY
        sync: false
      - key: INSIGHT_MODEL
        value: llama-3.3-70b-versatile
      - key: AGENT_MODEL
        value: llama-3.3-70b-versatile

  # --- Frontend React Static Web App ---
  - type: web
    name: agrobuddy-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    autoDeploy: true
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: agrobuddy-backend
          property: host
