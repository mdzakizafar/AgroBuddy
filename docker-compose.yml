services:
  # ==========================================================
  # AgroBuddy FastAPI Backend Service
  # ==========================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agrobuddy-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - INSIGHT_MODEL=${INSIGHT_MODEL:-llama-3.3-70b-versatile}
      - AGENT_MODEL=${AGENT_MODEL:-llama-3.3-70b-versatile}
    volumes:
      - ./duckdb:/app/duckdb
      - ./data:/app/data
    networks:
      - agrobuddy-net

  # ==========================================================
  # AgroBuddy React + Nginx Frontend Service
  # ==========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agrobuddy-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
      - "80:80"
    depends_on:
      - backend
    networks:
      - agrobuddy-net

networks:
  agrobuddy-net:
    driver: bridge
